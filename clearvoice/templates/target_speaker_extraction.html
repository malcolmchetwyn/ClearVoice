{% extends "base.html" %}
{% block content %}
<h2 class="title">Target Speaker Extraction</h2>
<form action="/target-speaker-extraction" method="post" enctype="multipart/form-data">
  <div class="field">
    <label class="label">Upload Video File (MP4/AVI)</label>
    <div class="control">
      <input class="input" type="file" name="file" accept=".mp4,.avi">
    </div>
  </div>
  <div class="control">
    <button class="button is-primary" type="submit">Start Extraction</button>
  </div>
</form>
{% endblock %}
